# Render Blueprint - https://render.com/docs/blueprint-spec
# Push this folder to GitHub, then: Render Dashboard > New + > Blueprint > pick the repo > Apply.
services:
  - type: web
    name: bangumi-recommender
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /
    # If a specific interpreter is required, add:
    # envVars:
    #   - key: PYTHON_VERSION
    #     value: "3.12.6"
